name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.2'
  IOS_VERSION: 'latest'
  DEVICE: 'iPhone 17'
  SWIFTFORMAT_VERSION: '0.61.1'
  SWIFTLINT_VERSION: '0.63.3'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Code Quality
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    # Die Tools werden als portable Binaries in der oben gepinnten Version
    # installiert — bewusst NICHT ueber Homebrew. Die macOS-Runner-Images bringen
    # swiftlint/swiftformat vorinstalliert mit; ein "brew install" lief deshalb nie,
    # und jedes Runner-Image-Update brachte eine andere Version als die gepinnte.
    # Die Folge war ein roter Job aus reinem Versions-Drift, ohne Codeaenderung.
    - name: Cache Swift tooling
      uses: actions/cache@v4
      with:
        path: ~/.swift-tools
        key: swift-tools-${{ runner.os }}-lint${{ env.SWIFTLINT_VERSION }}-format${{ env.SWIFTFORMAT_VERSION }}

    - name: Install pinned SwiftLint & SwiftFormat
      run: |
        set -euo pipefail
        TOOLS="$HOME/.swift-tools"
        mkdir -p "$TOOLS"

        if [ ! -x "$TOOLS/swiftlint" ]; then
          echo "Downloading SwiftLint $SWIFTLINT_VERSION..."
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          install -m 0755 "$RUNNER_TEMP/swiftlint/swiftlint" "$TOOLS/swiftlint"
        fi

        if [ ! -x "$TOOLS/swiftformat" ]; then
          echo "Downloading SwiftFormat $SWIFTFORMAT_VERSION..."
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          install -m 0755 "$RUNNER_TEMP/swiftformat/swiftformat" "$TOOLS/swiftformat"
        fi

        # Vor die Runner-Vorinstallation haengen. Wirkt erst im naechsten Step.
        echo "$TOOLS" >> "$GITHUB_PATH"

    - name: Verify pinned versions
      run: |
        set -euo pipefail
        INSTALLED_LINT=$(swiftlint version)
        INSTALLED_FORMAT=$(swiftformat --version)
        if [ "$INSTALLED_LINT" != "$SWIFTLINT_VERSION" ]; then
          echo "::error::SwiftLint $INSTALLED_LINT statt $SWIFTLINT_VERSION — es gewinnt eine andere Binary im PATH ($(command -v swiftlint))."
          exit 1
        fi
        if [ "$INSTALLED_FORMAT" != "$SWIFTFORMAT_VERSION" ]; then
          echo "::error::SwiftFormat $INSTALLED_FORMAT statt $SWIFTFORMAT_VERSION — es gewinnt eine andere Binary im PATH ($(command -v swiftformat))."
          exit 1
        fi
        echo "SwiftLint $INSTALLED_LINT ✓  SwiftFormat $INSTALLED_FORMAT ✓"

    - name: Run Code Quality Checks
      run: cd ios && make check

  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Setup Local Configuration
      run: |
        # Create Local.xcconfig from template for CI
        # CI doesn't need a real Team ID since we disable code signing
        cp ios/Config/Local.xcconfig.example ios/Config/Local.xcconfig
        # Replace placeholder with dummy value (CI uses CODE_SIGNING_REQUIRED=NO)
        sed -i '' 's/YOUR_TEAM_ID/CI_BUILD/' ios/Config/Local.xcconfig
        echo "✅ Created Local.xcconfig for CI build"

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
        key: ${{ runner.os }}-derived-${{ hashFiles('ios/**/*.swift', 'ios/**/*.m', 'ios/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-derived-

    - name: Cache SPM Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ios/.build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('ios/**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Show Available Simulators
      run: |
        echo "=== Installed iOS runtimes ==="
        xcrun simctl list runtimes | grep -i ios || true
        echo ""
        echo "=== Available iPhone simulators ==="
        xcrun simctl list devices available | grep "iPhone" | grep -v "unavailable" || true
        echo ""
        echo "=== xcodebuild project info ==="
        xcodebuild -list -project ios/StillMoment.xcodeproj 2>&1 || true
        echo ""
        echo "=== xcodebuild destinations for unit-test scheme (full) ==="
        xcodebuild -showdestinations \
          -project ios/StillMoment.xcodeproj \
          -scheme StillMoment-UnitTests 2>&1 || true

    - name: Boot Simulator
      run: |
        DEVICE_ID=$(xcrun simctl list devices available | grep -F "${{ env.DEVICE }} (" | grep -v "unavailable" | head -1 | sed -E 's/.*\(([A-Z0-9-]+)\).*/\1/')
        if [ -z "$DEVICE_ID" ]; then
          echo "❌ Could not find device matching '${{ env.DEVICE }}'"
          exit 1
        fi
        echo "📱 Booting $DEVICE_ID"
        xcrun simctl boot "$DEVICE_ID" || true
        for i in {1..30}; do
          if xcrun simctl list devices | grep "$DEVICE_ID" | grep -q "Booted"; then
            echo "✅ Simulator booted"
            break
          fi
          sleep 1
        done

    - name: Run Unit Tests
      run: cd ios && make test-unit

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: unit-test-failures
        path: ios/TestResults.xcresult
        retention-days: 7

  ui-tests:
    name: UI Tests
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Setup Local Configuration
      run: |
        # Create Local.xcconfig from template for CI
        # CI doesn't need a real Team ID since we disable code signing
        cp ios/Config/Local.xcconfig.example ios/Config/Local.xcconfig
        # Replace placeholder with dummy value (CI uses CODE_SIGNING_REQUIRED=NO)
        sed -i '' 's/YOUR_TEAM_ID/CI_BUILD/' ios/Config/Local.xcconfig
        echo "✅ Created Local.xcconfig for CI build"

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-ui-${{ hashFiles('ios/**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-derived-ui-
          ${{ runner.os }}-derived-

    - name: Reset Simulator
      run: cd ios && make simulator-reset

    - name: Warm up Simulator
      run: |
        # Boot simulator and let it settle
        echo "🔧 Booting simulator..."
        DEVICE_ID=$(xcrun simctl list devices available | grep -F "${{ env.DEVICE }} (" | grep -v "unavailable" | head -1 | sed -E 's/.*\(([A-Z0-9-]+)\).*/\1/')

        if [ -z "$DEVICE_ID" ]; then
          echo "❌ Error: Could not find device matching '${{ env.DEVICE }}'"
          exit 1
        fi

        echo "📱 Using device ID: $DEVICE_ID"
        xcrun simctl boot "$DEVICE_ID" || true

        # Wait for simulator to be fully booted
        echo "⏳ Waiting for simulator to be ready..."
        for i in {1..30}; do
          if xcrun simctl list devices | grep "$DEVICE_ID" | grep -q "Booted"; then
            echo "✅ Simulator is booted"
            break
          fi
          sleep 1
        done

        # Give simulator extra time to settle
        echo "⏳ Letting simulator settle (15 seconds)..."
        sleep 15

        echo "✅ Simulator warmup complete"

    - name: Run UI Tests
      timeout-minutes: 20
      run: cd ios && make test-ui

    - name: Upload UI Test Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-failures
        path: |
          ~/Library/Logs/DiagnosticReports/
          ios/TestResults.xcresult
        retention-days: 7

  static-analysis:
    name: Static Analysis (Xcode Analyzer)
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Setup Local Configuration
      run: |
        # Create Local.xcconfig from template for CI
        # CI doesn't need a real Team ID since we disable code signing
        cp ios/Config/Local.xcconfig.example ios/Config/Local.xcconfig
        # Replace placeholder with dummy value (CI uses CODE_SIGNING_REQUIRED=NO)
        sed -i '' 's/YOUR_TEAM_ID/CI_BUILD/' ios/Config/Local.xcconfig
        echo "✅ Created Local.xcconfig for CI build"

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-analyze-${{ hashFiles('ios/**/*.swift', 'ios/**/*.m', 'ios/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-analyze-

    - name: Run Xcode Static Analysis
      run: cd ios && make analyze DEVICE="${{ env.DEVICE }}" IOS_VERSION="${{ env.IOS_VERSION }}"

    - name: Upload Analysis Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-results
        path: ios/build/analyze.log
        retention-days: 7

  # ===================
  # Android Jobs
  # ===================

  android-code-quality:
    name: Android Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Run Code Quality Checks
      run: cd android && ./gradlew ktlintCheck lint detekt

    - name: Upload Quality Reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-quality-reports
        path: |
          android/app/build/reports/lint-results*.html
          android/app/build/reports/ktlint/
          android/app/build/reports/detekt/
        retention-days: 7

  android-build-and-test:
    name: Android Build & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Run Unit Tests
      run: cd android && ./gradlew test

    - name: Upload Test Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-test-results
        path: android/app/build/reports/tests/
        retention-days: 7

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 7
